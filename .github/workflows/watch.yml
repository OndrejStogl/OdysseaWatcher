name: Watch Odyssea IMAX tickets

on:
  schedule:
    # GitHub does not reliably run cron jobs every 5 minutes (can slip by
    # hours). Instead, this fires every ~5 hours just to restart the
    # watcher, which then loops internally and checks every few minutes
    # for up to ~5h40m before exiting cleanly (see MAX_RUNTIME_SECONDS in
    # watch_tickets.py). The "on: schedule" times below are UTC.
    - cron: "0 */5 * * *"
  workflow_dispatch:
    # Lets you trigger it manually from the GitHub Actions tab, with an
    # option to run in debug mode
    inputs:
      debug:
        description: "Run in debug mode (saves screenshot + text dump)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: odyssea-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}
        run: python watch_tickets.py

      - name: Upload debug artifacts
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_screenshot.png
            debug_page_text.txt

      - name: Commit updated state (safety net)
        if: ${{ github.event.inputs.debug != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update ticket state (final)"
          git push || true
